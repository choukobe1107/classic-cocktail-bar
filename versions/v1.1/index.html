<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>經典調酒吧｜v1.1 IBA+TW Canonical Cleanup r10</title>
    <!-- 引入支援中文的像素風格字體 -->
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 顏色系統 */
            --bg-dark: #0A0E17;
            --bg-panel: #151A2C;
            --bg-input: #111526;
            
            --primary: #FFB800; /* 黃金橘 */
            --primary-hover: #FFA300;
            
            --secondary-cyan: #00D2D3;
            --secondary-green: #39FF14;
            --secondary-red: #E63946;
            --secondary-red-light: #FFA1A1;
            
            --text-main: #E0E6ED;
            --text-muted: #6E7A99;
            
            --border-dark: #2D3753;
            --border-light: #4A5578;
            --shadow-hard: #05070D;
        }

        * {
            box-sizing: border-box;
            font-family: 'DotGothic16', monospace, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            background-image: radial-gradient(var(--border-dark) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* 手機優先容器 */
        #app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            position: relative;
            background-color: var(--bg-dark);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            overflow-x: hidden;
        }

        /* 按鈕風格 */
        .btn {
            background-color: var(--bg-panel);
            color: var(--text-main);
            border: 3px solid var(--border-light);
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 4px 4px 0 var(--shadow-hard);
            text-align: center;
            display: inline-block;
            transition: all 0.1s;
        }
        .btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0 var(--shadow-hard);
        }
        .btn-primary {
            background-color: var(--primary);
            color: #111;
            border-color: #FFE0A3;
        }
        .btn-dark {
            background-color: var(--bg-input);
            color: var(--text-muted);
            border-color: var(--border-dark);
        }

        /* 頂部 Logo */
        header {
            padding: 24px 20px 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        h1 { 
            margin: 0; 
            font-size: 26px; 
            color: var(--primary); 
            text-shadow: 3px 3px 0 var(--shadow-hard);
            letter-spacing: 2px;
        }

        /* 標籤頁 Tabs */
        .tabs {
            display: flex;
            padding: 0 16px;
            gap: 12px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px 0;
            background-color: var(--bg-input);
            color: var(--text-muted);
            border: 3px solid var(--border-dark);
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 3px 3px 0 var(--shadow-hard);
            transition: all 0.1s;
            font-weight: bold;
        }
        .tab-btn.active {
            background-color: var(--primary);
            color: #111;
            border-color: #FFE0A3;
        }

        /* 控制區 (搜尋與篩選) */
        .controls {
            background-color: var(--bg-panel);
            border: 3px solid var(--border-dark);
            border-radius: 12px;
            margin: 0 16px 20px;
            padding: 16px;
            box-shadow: 4px 4px 0 var(--shadow-hard);
        }
        .input-group { margin-bottom: 12px; }
        .input-rpg {
            width: 100%;
            padding: 12px;
            background: var(--bg-input);
            border: 3px solid var(--border-dark);
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            box-shadow: inset 3px 3px 0 rgba(0,0,0,0.5);
            transition: border-color 0.2s;
        }
        .input-rpg:focus { outline: none; border-color: var(--primary); }
        .input-rpg::placeholder { color: #4A5578; }
        
        select.input-rpg {
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg fill="%23FFB800" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position: right 8px center;
            padding-right: 32px;
            cursor: pointer;
        }
        
        .filter-row { display: flex; gap: 10px; margin-bottom: 12px; }
        .filter-row select { flex: 1; }

        .status-row {
            display: flex;
            justify-content: flex-end;
        }
        .status-tag {
            background: var(--bg-dark);
            border: 2px solid var(--border-light);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 13px;
            color: var(--secondary-cyan);
        }

        /* 酒譜列表與卡片 */
        .cocktail-list { 
            padding: 0 16px 80px; 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
        }
        .cocktail-card {
            background-color: var(--bg-panel);
            border: 3px solid var(--border-dark);
            border-radius: 12px;
            padding: 14px;
            box-shadow: 4px 4px 0 var(--shadow-hard);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .cocktail-card:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0 var(--shadow-hard);
        }
        
        .card-icon {
            width: 52px;
            height: 52px;
            background-color: var(--bg-input);
            border: 2px solid var(--border-light);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .cocktail-info { flex: 1; overflow: hidden; }
        .cocktail-info h3 { margin: 0 0 4px 0; font-size: 18px; color: var(--primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cocktail-info p { margin: 0 0 8px 0; font-size: 12px; color: var(--text-muted); }
        
        .card-badges { display: flex; gap: 6px; flex-wrap: wrap; }
        .badge { 
            font-size: 11px; 
            padding: 2px 6px; 
            border-radius: 4px; 
            border: 2px solid;
        }
        .badge-base { border-color: var(--secondary-cyan); color: var(--secondary-cyan); background: rgba(0, 210, 211, 0.1); }
        .badge-tech { border-color: var(--secondary-green); color: var(--secondary-green); background: rgba(57, 255, 20, 0.1); }

        .fav-btn {
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            border: none;
            cursor: pointer;
        }

        /* 年齡確認蓋板 (Intro Screen) */
        #age-gate {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; padding: 24px; text-align: center;
        }
        .legal-tag {
            background: var(--secondary-red);
            color: #fff;
            border: 2px solid var(--secondary-red-light);
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 12px;
            margin-bottom: 24px;
        }
        #age-gate h2 { color: var(--text-main); font-size: 24px; margin: 20px 0 8px; text-shadow: 2px 2px 0 var(--shadow-hard); letter-spacing: 1px; }
        #age-gate p { color: var(--text-muted); font-size: 14px; margin-bottom: 40px; }
        .age-btn-group { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 280px; }

        /* 詳細資訊 Modal */
        #modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 14, 23, 0.9); display: none;
            justify-content: center; align-items: center; z-index: 500;
        }
        .modal-content {
            width: 90%; max-width: 400px; max-height: 85vh; overflow-y: auto;
            background: var(--bg-panel);
            border: 4px solid var(--border-light);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 8px 8px 0 var(--shadow-hard);
            position: relative;
        }
        /* 自訂滾動條 */
        .modal-content::-webkit-scrollbar { width: 8px; }
        .modal-content::-webkit-scrollbar-track { background: var(--bg-input); border-radius: 4px; }
        .modal-content::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }

        .modal-header { border-bottom: 2px dashed var(--border-light); padding-bottom: 12px; margin-bottom: 16px; padding-right: 30px; }
        .modal-header h2 { color: var(--primary); margin: 0 0 4px; font-size: 22px; }
        .modal-header p { color: var(--text-muted); margin: 0; font-size: 14px; }
        
        .close-btn {
            position: absolute; top: 16px; right: 16px;
            background: var(--secondary-red); color: #fff;
            border: 2px solid var(--secondary-red-light); border-radius: 6px;
            width: 32px; height: 32px; font-weight: bold; font-size: 14px;
            cursor: pointer; box-shadow: 2px 2px 0 var(--shadow-hard);
            display: flex; justify-content: center; align-items: center;
        }
        .close-btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--shadow-hard); }

        .detail-row { margin-bottom: 14px; line-height: 1.6; font-size: 15px; }
        .detail-label { color: var(--secondary-cyan); font-weight: bold; margin-right: 4px; }
        .detail-text { color: var(--text-main); }
        .detail-list { color: var(--text-main); margin-top: 4px; padding-left: 12px; }


        .badge-id { border-color: var(--primary); color: var(--primary); background: rgba(255,184,0,0.08); }
        .badge-category { border-color: var(--secondary-cyan); color: var(--secondary-cyan); background: rgba(0,210,211,0.08); }
        .loading-box, .error-box {
            margin: 0 16px 20px;
            padding: 18px;
            background: var(--bg-panel);
            border: 3px solid var(--border-dark);
            border-radius: 12px;
            box-shadow: 4px 4px 0 var(--shadow-hard);
            text-align: center;
            color: var(--text-muted);
        }
        .error-box { color: var(--secondary-red-light); border-color: var(--secondary-red); }
        .source-link { color: var(--secondary-cyan); text-decoration: none; word-break: break-all; }
        .source-link:hover { text-decoration: underline; }


        /* v0.5：融合 v0.1 的 RPG 導航感 + v0.2 的卡片完成度 + v0.3 的資料架構 */
        .filter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }
        .card-number {
            color: var(--primary);
            font-size: 12px;
            margin-bottom: 2px;
        }
        .detail-section {
            margin-bottom: 16px;
        }
        .detail-section-title {
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 6px;
        }
        .detail-section-title::before {
            content: "▶ ";
            color: #FF6B00;
        }
        .detail-section-body {
            color: var(--text-main);
            line-height: 1.65;
            padding-left: 14px;
        }
        .card-title-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            min-width: 0;
        }
        .card-title-row h3 {
            margin: 0;
        }

        .hidden { display: none !important; }
    
        .lang-switch {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 10px 0 14px;
        }
        .lang-btn {
            border: 2px solid var(--border-light);
            background: var(--bg-panel);
            color: var(--text-muted);
            padding: 9px 6px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            border-radius: 6px;
        }
        .lang-btn.active {
            border-color: var(--primary);
            color: var(--bg-dark);
            background: var(--primary);
            font-weight: 700;
        }


        .filter-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .clear-btn {
            border: 2px solid var(--border-light);
            background: var(--bg-panel);
            color: var(--text-main);
            padding: 8px 10px;
            font-family: inherit;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .clear-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .active-filters {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .filter-chip {
            border: 1px solid var(--secondary-cyan);
            color: var(--secondary-cyan);
            padding: 3px 6px;
            font-size: 11px;
            border-radius: 4px;
            background: rgba(0,210,211,.06);
        }


        /* v0.9 cocktail image integration */
        .card-icon {
            width: 72px;
            height: 72px;
            overflow: hidden;
            padding: 0;
            background: #09111d;
        }
        .cocktail-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 36%;
            display: block;
        }
        .modal-cocktail-image-wrap {
            width: 100%;
            margin: 8px 0 18px;
            border: 2px solid var(--border-light);
            border-radius: 10px;
            overflow: hidden;
            background: #08111e;
            box-shadow: 3px 3px 0 var(--shadow-hard);
        }
        .modal-cocktail-image {
            width: 100%;
            max-height: 430px;
            object-fit: contain;
            display: block;
            background: #06101c;
        }
        .image-fallback {
            width: 100%; height: 100%;
            display:flex; align-items:center; justify-content:center;
        }

        .badge-source { border-color: var(--primary); color: var(--primary); background: rgba(255,184,0,.08); }
        .badge-review { border-color: var(--secondary-red-light); color: var(--secondary-red-light); background: rgba(230,57,70,.10); }


        /* v1.1 refined visual upgrade: luxury line-art logo + premium age gate */
        .brand-mark {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            filter: drop-shadow(0 2px 8px rgba(255,184,0,.18));
        }
        .brand-mark svg {
            width: 38px;
            height: 38px;
            display: block;
        }

        #age-gate {
            background:
                radial-gradient(circle at 50% 34%, rgba(255,184,0,.08), transparent 34%),
                linear-gradient(180deg, rgba(7,13,24,.98), rgba(6,10,18,.99));
        }
        .age-gate-card {
            width: min(88vw, 360px);
            padding: 34px 26px 28px;
            border: 1px solid rgba(255,208,92,.78);
            border-radius: 22px;
            background:
                linear-gradient(180deg, rgba(20,28,45,.97), rgba(10,15,26,.985));
            box-shadow:
                0 18px 48px rgba(0,0,0,.48),
                inset 0 0 0 1px rgba(255,255,255,.025),
                inset 0 0 28px rgba(255,184,0,.035);
            position: relative;
            overflow: hidden;
        }
        .age-gate-card::before {
            content: "";
            position: absolute;
            inset: 10px;
            border: 1px solid rgba(255,184,0,.18);
            border-radius: 15px;
            pointer-events: none;
        }
        .age-gate-emblem {
            width: 92px;
            height: 92px;
            margin: 0 auto 18px;
            border-radius: 50%;
            border: 1.5px solid rgba(255,205,86,.88);
            display: grid;
            place-items: center;
            position: relative;
            background:
                radial-gradient(circle at 50% 42%, rgba(255,184,0,.11), rgba(255,184,0,.025) 58%, transparent 70%);
            box-shadow:
                0 0 0 7px rgba(255,184,0,.035),
                0 10px 26px rgba(0,0,0,.34);
        }
        .age-gate-emblem::after {
            content: "";
            position: absolute;
            inset: 8px;
            border-radius: 50%;
            border: 1px solid rgba(255,184,0,.22);
        }
        .age-gate-emblem .age-number {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 31px;
            line-height: 1;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(255,184,0,.12);
            z-index: 1;
        }
        #age-gate h2 {
            color: #F4F0E8;
            font-size: 23px;
            margin: 8px 0 10px;
            text-shadow: none;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }
        .age-subtitle {
            color: #BFC8D9;
            font-size: 13px;
            line-height: 1.8;
            margin: 0 auto 20px;
            max-width: 280px;
            position: relative;
            z-index: 1;
        }
        .legal-tag {
            background: transparent;
            color: #FFB8B8;
            border: 1px solid rgba(230,57,70,.68);
            border-radius: 999px;
            padding: 5px 11px;
            font-size: 11px;
            margin-bottom: 14px;
            display: inline-block;
            position: relative;
            z-index: 1;
        }
        #age-gate p {
            color: #7887A7;
            font-size: 12px;
            margin: 0 0 28px;
            position: relative;
            z-index: 1;
        }
        .age-btn-group {
            gap: 12px;
            max-width: 290px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        #age-gate .btn {
            border-width: 1.5px;
            border-radius: 10px;
            box-shadow: none;
            letter-spacing: .5px;
        }
        #age-gate .btn:active {
            transform: translateY(1px);
            box-shadow: none;
        }
        #age-gate .btn-primary {
            background:
                linear-gradient(180deg, #FFC640 0%, #FFB000 100%);
            color: #111722;
            border-color: #FFD975;
            box-shadow: 0 8px 24px rgba(255,176,0,.16);
        }
        #age-gate .btn-dark {
            background: rgba(14,21,35,.88);
            color: #A9B3CA;
            border-color: #39435D;
        }
        .age-divider {
            width: 88px;
            height: 1px;
            margin: 18px auto 16px;
            background: linear-gradient(90deg, transparent, rgba(255,184,0,.64), transparent);
            position: relative;
            z-index: 1;
        }

</style>
</head>
<body>

<div id="app-container">
    <!-- 年齡確認畫面 (Intro Screen) -->
    <div id="age-gate">
        <div class="age-gate-card">
            <div class="age-gate-emblem" aria-hidden="true">
                <span class="age-number">18+</span>
            </div>

            <h2>未滿18歲，請勿飲酒</h2>
            <div class="age-divider"></div>
            <div class="age-subtitle">本內容僅供合法飲酒年齡之使用者瀏覽</div>

            <span class="legal-tag">理性飲酒｜Drink Responsibly</span>
            <p>飲酒過量，有礙健康</p>

            <div class="age-btn-group">
                <button class="btn btn-primary" onclick="enterTavern()">是，我已滿18歲</button>
                <button class="btn btn-dark" onclick="leaveTavern()">否，我先離開</button>
            </div>
        </div>
    </div>

    <!-- 主應用程式 -->
    <div id="main-app" class="hidden">
        <header>
            <!-- 精品金線版 Logo -->
            <div class="brand-mark" aria-label="Cocktail logo">
                <svg viewBox="0 0 64 64" role="img" aria-hidden="true">
                    <defs>
                        <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#FFE59A"/>
                            <stop offset="48%" stop-color="#FFB800"/>
                            <stop offset="100%" stop-color="#D99100"/>
                        </linearGradient>
                    </defs>
                    <path d="M12 14 H52 L36 32 H28 Z"
                          fill="none" stroke="url(#goldLine)" stroke-width="2.2"
                          stroke-linejoin="round"/>
                    <path d="M28 32 H36"
                          fill="none" stroke="url(#goldLine)" stroke-width="2.2"
                          stroke-linecap="round"/>
                    <path d="M32 32 V48"
                          fill="none" stroke="url(#goldLine)" stroke-width="2.2"
                          stroke-linecap="round"/>
                    <path d="M22 50 H42"
                          fill="none" stroke="url(#goldLine)" stroke-width="2.2"
                          stroke-linecap="round"/>
                    <path d="M17 18 H47"
                          fill="none" stroke="#00D2D3" stroke-width="1.5"
                          stroke-linecap="round" opacity=".85"/>
                    <circle cx="46" cy="13" r="2.4"
                            fill="#00D2D3" opacity=".95"/>
                </svg>
            </div>
            <h1 id="appTitle">經典調酒吧</h1>
        </header>

        <!-- 標籤頁 -->
        <div class="tabs">
            <button class="tab-btn active" id="tab-all">全部酒譜</button>
            <button class="tab-btn" id="tab-fav">收藏夾</button>
        </div>
        <div id="langSwitch" class="lang-switch" aria-label="顯示語言">
            <button class="lang-btn active" data-lang="zh">中文</button>
            <button class="lang-btn" data-lang="bilingual">中英對照</button>
            <button class="lang-btn" data-lang="en">英文</button>
        </div>


        <!-- v1.0-test：酒譜來源切換 -->
        <div class="controls" style="margin-bottom:14px;">
            <div class="input-group" style="margin-bottom:0;">
                <select id="sourceSelect" class="input-rpg" aria-label="酒譜來源">
                    <option value="iba">IBA 101</option>
                    <option value="twLevelB">乙級飲料調製(調酒)</option>
                </select>
                <div id="sourceHint" style="font-size:12px;color:var(--text-muted);margin-top:6px;">
                    目前來源：IBA 101
                </div>
            </div>
        </div>

        <!-- 控制區 -->
        <div class="controls">
            <div class="input-group">
                <input type="text" id="searchInput" class="input-rpg" placeholder="搜尋酒名、材料、編號 (如: Gin / 001)">
            <div class="search-examples" style="font-size:12px;color:var(--text-muted);margin-top:6px;">

    function inLearningSection(appId, section) {
        if (!section) return true;
        const n = parseInt(appId, 10);
        if (section === '001-010') return n >= 1 && n <= 10;
        if (section === '011-030') return n >= 11 && n <= 30;
        if (section === '031-060') return n >= 31 && n <= 60;
        if (section === '061-101') return n >= 61 && n <= 101;
        return true;
    }

    function inferBase(c) {
        const text = (c.ingredients || []).map(i => i.name || '').join(' ').toLowerCase();

        if (text.includes('gin')) return 'Gin';
        if (text.includes('vodka')) return 'Vodka';
        if (text.includes('tequila')) return 'Tequila';
        if (text.includes('pisco')) return 'Pisco';
        if (text.includes('cachaça') || text.includes('cachaca')) return 'Cachaca';
        if (text.includes('cognac') || text.includes('brandy') || text.includes('calvados')) return 'Brandy';
        if (text.includes('whiskey') || text.includes('whisky') || text.includes('bourbon') || text.includes('rye')) return 'Whiskey';
        if (text.includes('rum') || text.includes('rhum') || text.includes('ron')) return 'Rum';

        return 'Other';
    }

    function inferTechnique(c) {
        const method = (c.method || '').toLowerCase();
        if (method.includes('muddle')) return 'Muddle';
        if (method.includes('blend')) return 'Blend';
        if (method.includes('shake')) return 'Shake';
        if (method.includes('stir')) return 'Stir';
        if (method.includes('build') || method.includes('pour') || method.includes('directly')) return 'Build';
        return 'Other';
    }

    function shortCategory(category) {
        if (category === 'The Unforgettables') return 'Unforgettables';
        if (category === 'Contemporary Classics') return 'Contemporary Classics';
        return category || '';
    }

    function chineseSearchAliases(c) {
        const text = [
            c.official_name || '',
            ...(c.ingredients || []).map(i => i.name || ''),
            c.method || '',
            c.glassware || '',
            c.garnish || ''
        ].join(' ').toLowerCase();

        const aliases = [];
        const add = (...words) => aliases.push(...words);

        if (text.includes('gin')) add('琴酒');
        if (text.includes('vodka')) add('伏特加');
        if (text.includes('rum') || text.includes('rhum') || text.includes('ron')) add('蘭姆酒', '朗姆酒');
        if (text.includes('tequila')) add('龍舌蘭');
        if (text.includes('whiskey') || text.includes('whisky') || text.includes('bourbon') || text.includes('rye')) add('威士忌', '波本', '裸麥');
        if (text.includes('brandy') || text.includes('cognac') || text.includes('calvados')) add('白蘭地', '干邑');
        if (text.includes('pisco')) add('皮斯可');
        if (text.includes('cachaça') || text.includes('cachaca')) add('卡莎薩');
        if (text.includes('vermouth')) add('香艾酒', '苦艾酒');
        if (text.includes('campari')) add('金巴利');
        if (text.includes('lime')) add('萊姆');
        if (text.includes('lemon')) add('檸檬');
        if (text.includes('orange')) add('柳橙', '橙');
        if (text.includes('pineapple')) add('鳳梨');
        if (text.includes('cherry')) add('櫻桃');
        if (text.includes('mint')) add('薄荷');
        if (text.includes('sugar') || text.includes('syrup')) add('糖', '糖漿');
        if (text.includes('cream')) add('鮮奶油');
        if (text.includes('coffee')) add('咖啡');
        if (text.includes('grapefruit')) add('葡萄柚');

        return aliases.join(' ');

    function getRecipesArray(payload) {

    function canonicalGlassware(en, zh) {
        const text = `${en || ''} ${zh || ''}`.toLowerCase();
        if (text.includes('martini') || text.includes('cocktail glass') || text.includes('雞尾酒杯') || text.includes('馬丁尼')) return 'Cocktail/Martini';
        if (text.includes('old fashioned') || text.includes('rocks') || text.includes('古典杯')) return 'Old Fashioned/Rocks';
        if (text.includes('highball') || text.includes('collins') || text.includes('高球') || text.includes('collins')) return 'Highball/Collins';
        if (text.includes('coupe') || text.includes('coupette') || text.includes('coppa')) return 'Coupe';
        if (text.includes('champagne') || text.includes('flute') || text.includes('香檳')) return 'Champagne';
        if (text.includes('wine glass') || text.includes('葡萄酒杯')) return 'Wine';
        if (text.includes('tiki')) return 'Tiki';
        if (text.includes('julep')) return 'Julep';
        if (text.includes('mule')) return 'Mule';
        if (text.includes('hurricane')) return 'Hurricane';
        if (text.includes('goblet') || text.includes('footed') || text.includes('高腳')) return 'Goblet/Footed';
        if (text.includes('tumbler') || text.includes('直筒')) return 'Tumbler';
        return 'Other';
    }

    function isAlcoholicIngredientName(name = '') {
        const t = String(name).toLowerCase();
        const keywords = [
            'vermouth','liqueur','crème de','creme de','campari','aperol','amaro','chartreuse',
            'bénédictine','benedictine','curacao','curaçao','cointreau','grand marnier','kahlúa','kahlua',
            "bailey's",'baileys','drambuie','dubonnet','port','sherry','wine','champagne','prosecco',
            'sparkling wine','schnapps','maraschino','absinthe','fernet','lillet','cynar','falernum',
            'bitters','angostura','peychaud','gin','vodka','rum','rhum','ron','tequila','mezcal','pisco',
            'cachaça','cachaca','aguardiente','grappa','brandy','cognac','calvados','whiskey','whisky',
            'bourbon','rye','scotch','allspice st. elizabeth','cherry sangue morlacco','cherry brandy'
        ];
        return keywords.some(k => t.includes(k));
    }

    function isPrimarySpiritIngredient(name = '', primaryGroup = '', primarySpirit = '') {
        const n = String(name || '').trim().toLowerCase();
        const p = String(primarySpirit || '').trim().toLowerCase();

        const startsWithTerm = (value, term) =>
            value === term || value.startsWith(term + ' ');

        // 先比對資料中已判定的 primarySpirit。
        if (p && startsWithTerm(n, p)) return true;

        // 再依主酒群組比對。避免 Ginger Ale 因含有 "gin" 而誤判成 Gin。
        const groupTerms = {
            Gin: ['gin', 'london dry gin', 'old tom gin'],
            Vodka: ['vodka', 'vodka citron'],
            Rum: ['rum', 'white rum', 'dark rum', 'rhum', 'ron', 'white cuban ron'],
            Tequila: ['tequila'],
            Whiskey: ['whiskey', 'whisky', 'bourbon', 'rye whiskey', 'blended scotch whisky'],
            Brandy: ['brandy', 'cognac', 'calvados'],
            Other: []
        };

        return (groupTerms[primaryGroup] || []).some(term => startsWithTerm(n, term));
    }

    function extractSecondaryAlcoholItems(ingredients = [], primaryGroup = '', primarySpirit = '') {
        const seen = new Set();
        const out = [];
        ingredients.forEach(i => {
            const name = i.name || '';
            if (!name || !isAlcoholicIngredientName(name)) return;
            if (isPrimarySpiritIngredient(name, primaryGroup, primarySpirit)) return;
            if (seen.has(name)) return;
            seen.add(name);
            out.push({ name, name_zh: i.name_zh || '' });
        });
        return out;
    }

    function normalizeV2Recipe(r) {

    function inferPrimarySpiritFromIngredients(ingredients = []) {
        const names = (ingredients || []).map(i => String(i?.name || '').trim());

        const exactOrPrefix = (name, patterns) => {
            const n = name.toLowerCase();
            return patterns.some(p => p.test(n));
        };

        for (const name of names) {
            if (exactOrPrefix(name, [/^gin\b/, /^london dry gin\b/, /^old tom gin\b/])) return ['Gin','Gin'];
            if (exactOrPrefix(name, [/^vodka\b/, /^vodka citron\b/])) return ['Vodka','Vodka'];
            if (exactOrPrefix(name, [/^tequila\b/])) return ['Tequila','Tequila'];
            if (exactOrPrefix(name, [/^cachaça\b/, /^cachaca\b/])) return ['Cachaça','Other'];
            if (exactOrPrefix(name, [/^pisco\b/])) return ['Pisco','Other'];
            if (exactOrPrefix(name, [/^brandy\b/, /^cognac\b/, /^calvados\b/])) return ['Brandy','Brandy'];
            if (exactOrPrefix(name, [/^whiskey\b/, /^whisky\b/, /^bourbon\b/, /^rye whiskey\b/, /^blended scotch whisky\b/])) return ['Whiskey','Whiskey'];
            if (exactOrPrefix(name, [/^rum\b/, /^white rum\b/, /^dark rum\b/, /^ron\b/, /^rhum\b/, /^white cuban ron\b/])) return ['Rum','Rum'];
        }
        return ['', 'Other'];
    }

            // Common independent canonical names

            [/^kahl[uú]a$/i, 'Kahlúa'],
            [/^passion fruit liqueur$/i, 'Passion Fruit Liqueur'],
            [/^raspberry liqueur$/i, 'Raspberry Liqueur'],
            [/^peychaud'?s bitters$/i, "Peychaud's Bitters"],
            [/^red tawny port wine$/i, 'Red Tawny Port Wine'],
            [/^prosecco$/i, 'Prosecco'],

            // Existing useful mappings kept
            [/^cherry brandy( \(liqueur\))?$/i, 'Cherry Brandy (Liqueur)'],
            [/^apricot brandy$/i, 'Apricot Brandy'],
            [/^amaro nonino$/i, 'Amaro Nonino'],

    function isPrimarySpiritIngredient(name = '', primarySpirit = '') {
        const n = String(name || '').trim().toLowerCase();
        const p = String(primarySpirit || '').trim().toLowerCase();

        const startsWithTerm = (value, term) =>
            value === term || value.startsWith(term + ' ');

        const groups = {
            gin: ['gin', 'london dry gin', 'old tom gin'],
            vodka: ['vodka', 'vodka citron'],
            tequila: ['tequila'],
            whiskey: ['whiskey', 'whisky', 'bourbon', 'rye whiskey', 'blended scotch whisky'],
            brandy: ['brandy', 'cognac', 'calvados'],
            rum: ['rum', 'white rum', 'dark rum', 'ron', 'rhum', 'white cuban ron'],
            pisco: ['pisco'],
            'cachaça': ['cachaça', 'cachaca']
        };

        const key = p.includes('gin') ? 'gin'
            : p.includes('vodka') ? 'vodka'
            : p.includes('tequila') ? 'tequila'
            : p.includes('whiskey') || p.includes('whisky') ? 'whiskey'
            : p.includes('brandy') ? 'brandy'
            : p.includes('rum') ? 'rum'
            : p.includes('pisco') ? 'pisco'
            : (p.includes('cachaça') || p.includes('cachaca')) ? 'cachaça'
            : '';

        if (!key) return false;
        return groups[key].some(term => startsWithTerm(n, term));
    }

    function isSecondaryAlcoholCandidate(name = '') {
        const raw = String(name || '').trim();
        const t = raw.toLowerCase();

        if (!raw) return false;

        const reject = [
            'juice','syrup','soda','water','coffee','espresso','tea','milk','cream',
            'sugar','salt','banana','lime','lemon','orange','grapefruit','pineapple',
            'mint','cucumber','celery','ginger ale','ginger beer','egg','ice'
        ];
        if (reject.some(x => t.includes(x))) return false;

        const accept = [
            'liqueur','liqueur','vermouth','campari','aperol','absinthe','bitters',
            'crème de','creme de','cointreau','triple sec','bailey','bénédictine','benedictine',
            'kahlúa','kahlua','drambuie','curaçao','curacao','amaretto','amaro','port',
            'sherry','champagne','prosecco','brandy','allspice st. elizabeth'
        ];
        return accept.some(x => t.includes(x));
    }

    function inferSecondaryAlcohols(ingredients = [], primarySpirit = '') {
        const out = [];
        for (const i of (ingredients || [])) {
            const name = i?.name || '';
            if (!name) continue;
            if (isPrimarySpiritIngredient(name, primarySpirit)) continue;
            if (!isSecondaryAlcoholCandidate(name)) continue;
            out.push(normalizeAlcoholName(name));
        }
        return [...new Set(out.filter(Boolean))];
    }

    function garnishCategoriesFromText(text = '') {
        const t = text.toLowerCase();
        const out = [];
        const pairs = [
            ['lemon','Lemon'],['lime','Lime'],['orange','Orange'],['grapefruit','Grapefruit'],
            ['olive','Olive'],['cherry','Cherry'],['pineapple','Pineapple'],['mint','Mint'],
            ['coffee','Coffee beans'],['nutmeg','Nutmeg'],['salt rim','Salt rim'],['celery','Celery'],
            ['cucumber','Cucumber'],['ginger','Ginger'],['basil','Basil'],['cinnamon','Cinnamon']
        ];
        pairs.forEach(([needle,label]) => { if (t.includes(needle)) out.push(label); });
        return out;
    }
    function normalizeTwLevelBRecipe(r) {

        const cls = r.classification || {};
        const names = r.names || {};
        const source = r.source || {};

        const verification = r.verification || {};

        const ingredients = (recipe.ingredients || []).map(i => ({
            name: i.name_official || '',
            name_zh: i.name_zh || '',
            amount: i.amount_official || i.amount_zh || '',
            amount_zh: i.amount_zh || '',

        const garnishItems = recipe.garnish_items || [];
        const garnishEn = recipe.garnish_official || '';
        const garnishZh = recipe.garnish_zh || '';
        const inferredPrimary = inferPrimarySpiritFromIngredients(ingredients);
        const primary = cls.primary_spirit_search || inferredPrimary[0];
        const primaryGroup = cls.primary_spirit_group || inferredPrimary[1];
        const secondaryAlcohols = inferSecondaryAlcohols(ingredients, primary);

        return {
            app_id: r.app_id || source.source_record_id || '',
            official_name: names.official || '',
            chinese_name: names.zh || '',

            category: cls.official_category || source.source_group || '',

            main_method: cls.main_method_search || '',
            garnish_present: cls.garnish_present ?? !!(garnishItems.length || (garnishEn && garnishEn !== 'N/A')),
            garnish_categories:
                Array.isArray(cls.garnish_categories) && cls.garnish_categories.length > 0
                    ? cls.garnish_categories

            auxiliary_operations: recipe.auxiliary_operations || [],

            glassware: recipe.glassware_official || '',

            garnish: garnishEn,

            official_url: source.official_url || '',

    function matchesExcept(c, exceptKey) {
        const s = currentFilterState();
        const searchable = [
            c.search_index,
            c.app_id,
            c.official_name,
            c.chinese_name,
            ...(c.aliases || []),
            ...(c.ingredient_aliases || []),
            ...(c.glassware_aliases || []),
            ...(c.garnish_aliases || []),
            ...(c.technique_aliases || []),
            c.method,
            c.method_zh,
            c.glassware,
            c.glassware_zh,
            c.garnish,
            c.garnish_zh
        ].join(' ').toLowerCase();

        if (exceptKey !== 'q' && s.q && !searchable.includes(s.q)) return false;
        if (exceptKey !== 'base' && s.base && c.primary_spirit_group !== s.base) return false;
        if (exceptKey !== 'secondaryAlcohol' && s.secondaryAlcohol && !(c.secondary_alcohols || []).includes(s.secondaryAlcohol)) return false;
        if (exceptKey !== 'otherSpirit' && s.otherSpirit && c.primary_spirit !== s.otherSpirit) return false;
        if (exceptKey !== 'tech' && s.tech && c.main_method !== s.tech) return false;
        if (exceptKey !== 'category' && s.category && c.category !== s.category) return false;
        if (exceptKey !== 'section' && s.section && c.learning_section !== s.section) return false;
        if (exceptKey !== 'garnishPresence' && s.garnishPresence) {
            if (s.garnishPresence === 'yes' && !c.garnish_present) return false;
            if (s.garnishPresence === 'no' && c.garnish_present) return false;
        }
        if (exceptKey !== 'garnishType' && s.garnishType && !(c.garnish_categories || []).includes(s.garnishType)) return false;
        if (exceptKey !== 'glassware' && s.glassware && c.glassware_group !== s.glassware) return false;
        return true;
    }

    function naturalGroupSort(a, b) {
        const ma = String(a).match(/^C(\d+)$/i);
        const mb = String(b).match(/^C(\d+)$/i);
        if (ma && mb) return Number(ma[1]) - Number(mb[1]);
        return String(a).localeCompare(String(b), 'zh-TW', { numeric: true });
    }

    function cleanSecondaryZhLabel(zh = '', canonical = '') {
        let s = String(zh || '').trim();
        const en = String(canonical || '').toLowerCase();

        // 只處理「英文字/品牌詞 + 中文」這種情況。
        // 例如：
        // Mozart 黑巧克力香甜酒 -> 黑巧克力香甜酒
        // Triple Sec 橙味香甜酒 -> 橙味香甜酒
        // DOM 班尼狄克丁香甜酒 -> 班尼狄克丁香甜酒
        // Cinzano Rosso 甜香艾酒 -> 甜香艾酒
        const prefixMatch = s.match(/^([A-Za-zÀ-ÖØ-öø-ÿ0-9.'’\- ]+)\s+([\u3400-\u9fff].*)$/);
        if (prefixMatch) {
            const prefix = prefixMatch[1].trim().toLowerCase();
            const zhPart = prefixMatch[2].trim();

            // 只有當這個英文前綴確實也存在於 canonical 英文裡才移除，
            // 避免誤刪真正屬於中文正式名的一部分。
            const prefixWords = prefix.split(/\s+/).filter(Boolean);
            if (prefixWords.length && prefixWords.every(w => en.includes(w))) {
                s = zhPart;
            }
        }

        return s;
    }

    async function loadCocktails(sourceKey = currentSource) {
        const config = DATA_SOURCES[sourceKey] || DATA_SOURCES.iba;
        currentSource = config.key;
        localStorage.setItem('cocktailSource', currentSource);
        dataLoaded = false;
        cocktails = [];
        resultCount.innerText = '載入中...';
        loadStatus.className = 'loading-box';
        loadStatus.classList.remove('hidden');
        loadStatus.innerHTML = `正在讀取 ${escapeHtml(config.label)}...`;

        if (sourceSelect) sourceSelect.value = currentSource;
        if (sourceHint) sourceHint.textContent = `目前來源：${config.label}`;
        if (appTitle) appTitle.textContent = currentSource === 'iba' ? 'IBA 101 經典調酒吧' : '乙級飲料調製(調酒)';

        try {
            const response = await fetch(config.path, { cache: 'no-store' });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const payload = await response.json();
            const recipes = getRecipesArray(payload);

            if (!recipes.length) {
                throw new Error('JSON 結構不正確：找不到 recipes/cocktails 陣列');
            }

            cocktails = currentSource === 'iba'
                ? recipes.map(normalizeV2Recipe)
                : recipes.map(normalizeTwLevelBRecipe);

            dataLoaded = true;
            clearFilters();
            loadStatus.classList.add('hidden');

            if (cocktails.length !== config.expectedCount) {
                console.warn(`目前載入 ${cocktails.length} 筆，預期為 ${config.expectedCount} 筆。`);
            }

            renderList();
        } catch (error) {
            console.error(error);
            loadStatus.className = 'error-box';
            loadStatus.innerHTML = `資料載入失敗：${escapeHtml(error.message)}<br><br>請確認 <b>${escapeHtml(config.path.split('/').pop())}</b> 已上傳到 GitHub 的 data 資料夾。`;
            resultCount.innerText = '載入失敗';
        }
    }

    function displayName(c) {
        if (languageMode === 'en') return c.official_name || c.chinese_name || '';
        if (languageMode === 'bilingual') {
            const zh = c.chinese_name || '';
            const en = c.official_name || '';
            return zh && en ? `${zh}｜${en}` : (zh || en);
        }
        return c.chinese_name || c.official_name || '';
    }

    function secondaryName(c) {
        if (languageMode === 'en') return '';
        if (languageMode === 'bilingual') return '';
        return c.official_name || '';
    }
    function ingredientLabel(i) {
        const zh = i.name_zh || '';
        const en = i.name || '';
        if (languageMode === 'en') return en || zh;
        if (languageMode === 'bilingual') return zh && en ? `${zh}｜${en}` : (zh || en);
        return zh || en;
    }
    function methodText(c) {
        const zh = c.method_zh || '';
        const en = c.method || '';
        if (languageMode === 'en') return en || zh;
        if (languageMode === 'bilingual') return zh && en ? `${zh}｜${en}` : (zh || en);
        return zh || en;
    }
    function glasswareText(c) {
        const zh = c.glassware_zh || '';
        const en = c.glassware || '';
        if (languageMode === 'en') return en || zh;
        if (languageMode === 'bilingual') return zh && en ? `${zh}｜${en}` : (zh || en);
        return zh || en;
    }
    function garnishText(c) {
        const zh = c.garnish_zh || '';
        const en = c.garnish || '';
        if (languageMode === 'en') return en || zh;
        if (languageMode === 'bilingual') return zh && en ? `${zh}｜${en}` : (zh || en);
        return zh || en;
    }

    function mainMethodText(c) {
        const labels = {
            "Shake": ["搖盪法", "Shake"],
            "Stir": ["攪拌法", "Stir"],
            "Build": ["直調法", "Build"],
            "Blend": ["電動攪拌法", "Blend"],
            "Swizzle": ["Swizzle 法", "Swizzle"],
            "Other": ["其他", "Other"]
        };
        const pair = labels[c.main_method] || [c.main_method || '-', c.main_method || '-'];
        if (languageMode === 'en') return pair[1];
        if (languageMode === 'bilingual') return `${pair[0]}｜${pair[1]}`;
        return pair[0];
    }
    function auxiliaryText(c) {
        const zhMap = {
            'Build':'直接注入法',
            'Shake':'搖盪法',
            'Stir':'攪拌法',
            'Blend':'電動攪拌法',
            'Float':'漂浮法',
            'Muddle':'壓搗法',
            'Pour':'注入法',
            'Layer':'分層法',
            'Top':'補滿',
            'Rinse':'潤杯',
            'Strain':'濾出'
        };
        const arr = c.auxiliary_operations || [];
        if (!arr.length) return '—';
        return arr.map(x => {
            const zh = zhMap[x] || x;
            if (languageMode === 'en') return x;
            if (languageMode === 'bilingual') return zh === x ? x : `${zh}｜${x}`;
            return zh;
        }).join(' → ');
    }

    /* duplicate auxiliary block removed */
    /* 
            const zh = zhMap[x] || x;
            if (languageMode === 'en') return x;
            if (languageMode === 'bilingual') return zh === x ? x : `${zh}｜${x}`;
            return zh;
        }).join(' → ');
    */

    function categoryText(c) {
        if (currentSource === 'twLevelB') {
            return c.category || c.source_group || '—';
        }
        const map = {
            "The Unforgettables":"經典永恆｜The Unforgettables",
            "Contemporary Classics":"當代經典｜Contemporary Classics",
            "New Era":"新世代｜New Era"
        };
        const en = c.category || '';
        if (languageMode === 'en') return en;
        if (languageMode === 'bilingual') return map[en] || en;
        return (map[en] || en).split('｜')[0];
    }

    function primarySpiritText(c) {
        const zhMap = {
            "Gin":"琴酒",
            "Vodka":"伏特加",
            "Rum":"蘭姆酒",
            "Tequila":"龍舌蘭",
            "Whiskey":"威士忌",
            "Brandy":"白蘭地",
            "Pisco":"皮斯可",
            "Cachaça":"卡莎薩",
            "Mezcal":"梅斯卡爾",
            "Aguardiente":"Aguardiente",
            "Grappa":"Grappa",
            "Other":"其他主要烈酒"
        };
        const en = c.primary_spirit || c.primary_spirit_group || '';
        const zh = zhMap[en] || en || '—';
        if (languageMode === 'en') return en || '—';
        if (languageMode === 'bilingual') return zh === en ? zh : `${zh}｜${en}`;
        return zh;
    }

    function fieldLabel(zh, en) {
        if (languageMode === 'en') return en;
        if (languageMode === 'bilingual') return `${zh}｜${en}`;
        return zh;
    }

    function setLanguageMode(mode) {
        languageMode = mode;
        localStorage.setItem('cocktailLangMode', mode);
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.lang === mode);
        });
        renderList();
    }


    function updateActiveFilterChips() {
        if (!activeFilters) return;
        const items = [];
        const push = (label, el) => { if (el && el.value) items.push(`${label}：${el.options[el.selectedIndex]?.text || el.value}`); };

        push('主酒', baseFilter);
        push('副酒／利口酒', secondaryAlcoholFilter);
        push('其他主酒', otherSpiritFilter);
        push('製作法', techFilter);
        push(currentSource === 'iba' ? 'IBA' : '組別', categoryFilter);
        push(currentSource === 'iba' ? '學習區段' : 'C組別', sectionFilter);
        push('裝飾', garnishPresenceFilter);
        push('裝飾種類', garnishTypeFilter);
        push('杯型', glasswareFilter);

        const q = searchInput?.value?.trim();
        if (q) items.unshift(`搜尋：${q}`);

        activeFilters.innerHTML = items.map(x => `<span class="filter-chip">${escapeHtml(x)}</span>`).join('');
    }


    const COCKTAIL_ASSET_BASE = '/classic-cocktail-bar/assets/cocktails/';
    const cocktailImageMode = 'normal'; // future: pixel16

    // v1.1：新版 JSON 的 cocktail_image.normal 已存完整 repository-relative path。
    // 例如：
    // assets/cocktails/iba/normal/001-dry-martini.webp
    // assets/cocktails/taiwan-level-b/normal/001-espresso-daiquiri.webp
    function resolveAssetPath(path) {
        if (!path) return '';
        if (/^https?:\/\//i.test(path)) return path;
        if (path.startsWith('/classic-cocktail-bar/')) return path;
        if (path.startsWith('assets/')) return '/classic-cocktail-bar/' + path;
        return path;
    }

    function cocktailImageUrl(c, mode = cocktailImageMode) {
        const imagePath = mode === 'pixel16' ? c.cocktail_image_pixel16 : c.cocktail_image_normal;
        if (!imagePath) return '';

        // 新版 JSON：直接使用資料中的完整相對路徑。
        if (imagePath.startsWith('assets/') || imagePath.startsWith('/classic-cocktail-bar/') || /^https?:\/\//i.test(imagePath)) {
            return resolveAssetPath(imagePath);
        }

        // 舊資料相容 fallback（若未來暫時載入舊 JSON 仍可顯示）
        if (currentSource === 'iba') {
            return `${COCKTAIL_ASSET_BASE}iba/${mode}/${encodeURIComponent(imagePath)}`;
        }
        return `${COCKTAIL_ASSET_BASE}taiwan-level-b/${mode}/${encodeURIComponent(imagePath)}`;
    }

    function cardImageHtml(c) {
        const url = cocktailImageUrl(c);
        if (!url) return `<div class="image-fallback">${getGlassSvg(c.glassware || '')}</div>`;
        const fallback = escapeHtml(getGlassSvg(c.glassware || '').replace(/`/g, ''));
        return `<img class="cocktail-thumb" src="${escapeHtml(url)}" alt="${escapeHtml(c.official_name)}" loading="lazy"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="image-fallback" style="display:none;">${getGlassSvg(c.glassware || '')}</div>`;
    }

    function modalImageHtml(c) {
        const url = cocktailImageUrl(c);
        if (!url) return '';
        return `<div class="modal-cocktail-image-wrap">
            <img class="modal-cocktail-image" src="${escapeHtml(url)}" alt="${escapeHtml(c.official_name)}"
                 onerror="this.parentElement.style.display='none';">
        </div>`;
    }


    function sourceLabelFor(c) {
        if (currentSource === 'iba') return 'IBA';

        if (languageMode === 'en') {
            return 'Taiwan Level B';
        }
        if (languageMode === 'bilingual') {
            return '飲料調製乙級｜Taiwan Level B';
        }
        return '飲料調製乙級';
    }

    function renderList() {
        updateActiveFilterChips();
        updateLinkedFilters();
        if (!dataLoaded) {
            resultCount.innerText = '載入中...';
            return;
        }

        const searchTerm = searchInput.value.trim().toLowerCase();
        const base = baseFilter.value;
        const secondaryAlcohol = secondaryAlcoholFilter ? secondaryAlcoholFilter.value : '';
        const otherSpirit = otherSpiritFilter ? otherSpiritFilter.value : '';
        const tech = techFilter.value;
        const category = categoryFilter.value;
        const section = sectionFilter.value;
        const garnishPresence = garnishPresenceFilter ? garnishPresenceFilter.value : '';
        const garnishType = garnishTypeFilter ? garnishTypeFilter.value : '';
        const glassware = glasswareFilter ? glasswareFilter.value : '';

        const filtered = cocktails.filter(c => {
            const ingredientText = (c.ingredients || [])
                .map(i => `${i.name || ''} ${i.amount || ''}`)
                .join(' ')
                .toLowerCase();

            const searchable = [
                c.search_index,
                c.app_id,
                c.official_name,
                c.chinese_name,
                ...(c.aliases || []),
                ...(c.ingredient_aliases || []),
                ...(c.glassware_aliases || []),
                ...(c.garnish_aliases || []),
                ...(c.technique_aliases || []),
                c.method,
                c.method_zh,
                c.glassware,
                c.glassware_zh,
                c.garnish,
                c.garnish_zh
            ].join(' ').toLowerCase();

            const matchSearch = !searchTerm || searchable.includes(searchTerm);
            const matchBase = !base || c.primary_spirit_group === base;
            const matchSecondaryAlcohol = !secondaryAlcohol || (c.secondary_alcohols || []).includes(secondaryAlcohol);
            const matchOtherSpirit = !otherSpirit || c.primary_spirit === otherSpirit;
            const matchTech = !tech || c.main_method === tech;
            const matchCategory = !category || c.category === category;
            const matchSection = !section || c.learning_section === section;
            const matchGarnishPresence = !garnishPresence ||
                (garnishPresence === 'yes' ? c.garnish_present : !c.garnish_present);
            const matchGarnishType = !garnishType ||
                (c.garnish_categories || []).includes(garnishType);
            const matchGlassware = !glassware || c.glassware_group === glassware;
            const matchFav = currentTab === 'all' || favorites.includes(c.app_id);

            return matchSearch && matchBase && matchSecondaryAlcohol && matchOtherSpirit && matchTech &&
                   matchCategory && matchSection && matchGarnishPresence &&
                   matchGarnishType && matchGlassware && matchFav;
        });

        resultCount.innerText = `篩選結果 ${filtered.length} 款｜共 ${cocktails.length} 款`;
        listContainer.innerHTML = '';

        if (filtered.length === 0) {
            listContainer.innerHTML = `
                <div style="text-align:center; padding:32px 16px; color:var(--text-muted);">
                    沒有找到符合的酒譜。<br><br>
                    <button class="btn btn-dark" onclick="clearFilters()">[ 清除搜尋與篩選 ]</button>
                </div>`;
            return;
        }

        filtered.forEach(c => {
            const isFav = favorites.includes(c.app_id);
            const card = document.createElement('div');
            card.className = 'cocktail-card';
            card.onclick = () => openModal(c);

            card.innerHTML = `
                <div class="card-icon">
                    ${cardImageHtml(c)}
                </div>
                <div class="cocktail-info">
                    <div class="card-title-row">
                        <div class="card-number">${escapeHtml(c.app_id)}</div>
                        <h3>${escapeHtml(displayName(c))}</h3>
                    </div>
                    <p>${escapeHtml(secondaryName(c))}</p>
                    <div class="card-badges">
                        <span class="badge badge-source">${escapeHtml(sourceLabelFor(c))}</span>
                        <span class="badge badge-category">${escapeHtml(shortCategory(c.category))}</span>
                        ${c.app_final === false ? '<span class="badge badge-review">待確認</span>' : ''}
                    </div>
                </div>
                <button class="fav-btn" aria-label="收藏" onclick="toggleFav(event, '${escapeHtml(c.app_id)}')">
                    ${getHeartSvg(isFav)}
                </button>
            `;
            listContainer.appendChild(card);
        });
    }

    function clearFilters() {
        searchInput.value = '';
        baseFilter.value = '';
        if (secondaryAlcoholFilter) secondaryAlcoholFilter.value = '';
        if (otherSpiritFilter) otherSpiritFilter.value = '';
        techFilter.value = '';
        categoryFilter.value = '';
        sectionFilter.value = '';
        if (garnishPresenceFilter) garnishPresenceFilter.value = '';
        if (garnishTypeFilter) garnishTypeFilter.value = '';
        if (glasswareFilter) glasswareFilter.value = '';
        updateLinkedFilters();
        renderList();
    }

    function toggleFav(e, id) {
        e.stopPropagation();

        if (favorites.includes(id)) {
            favorites = favorites.filter(favId => favId !== id);
        } else {
            favorites.push(id);
        }

        localStorage.setItem('pixelBarFavsV10', JSON.stringify(favorites));
        renderList();
    }

    function openModal(c) {
        const ingredientsHtml = (c.ingredients || [])
            .map(i => `• ${escapeHtml(ingredientLabel(i))}${i.amount ? ` — ${escapeHtml(i.amount)}` : ''}`)
            .join('<br>');

        const notesText = c.review_note || c.notes || '';
        const notesHtml = notesText
            ? `<div class="detail-section">
                 <div class="detail-section-title">${escapeHtml(fieldLabel('備註','Notes'))}</div>
                 <div class="detail-section-body" style="color:#FFA1A1;">${escapeHtml(
                    currentSource === 'twLevelB'
                        ? (languageMode === 'zh' ? notesText :
                           languageMode === 'bilingual' ? `${notesText}｜${notesText}` : notesText)
                        : notesText
                 )}</div>
               </div>`
            : '';

        const sourceName = currentSource === 'iba'
            ? 'IBA 2026'
            : (languageMode === 'en'
                ? 'Taiwan Beverage Preparation Level B'
                : (languageMode === 'bilingual'
                    ? '飲料調製乙級｜Taiwan Beverage Preparation Level B'
                    : '飲料調製乙級'));

        const sourceHtml = c.official_url
            ? `<a class="source-link" href="${escapeHtml(c.official_url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(sourceName)}</a>`
            : escapeHtml(sourceName);

        const groupLabel = currentSource === 'iba'
            ? fieldLabel('IBA 分類','IBA Category')
            : fieldLabel('試題組別','Exam Group');

        const extraTw = currentSource === 'twLevelB'
            ? `
            <div class="detail-section">
                <div class="detail-section-title">${escapeHtml(fieldLabel('製作杯數','Servings'))}</div>
                <div class="detail-section-body">${escapeHtml(c.servings ?? 1)}</div>
            </div>
            <div class="detail-section">
                <div class="detail-section-title">${escapeHtml(fieldLabel('資料狀態','Data Status'))}</div>
                <div class="detail-section-body">${
                    c.app_final === false
                        ? (languageMode === 'en' ? 'Review' : (languageMode === 'bilingual' ? '待確認｜Review' : '待確認'))
                        : (languageMode === 'en' ? 'Verified' : (languageMode === 'bilingual' ? '已確認｜Verified' : '已確認'))
                }</div>
            </div>`
            : '';

        modalContentBox.innerHTML = `
            <button class="close-btn" onclick="closeModal()">X</button>

            <div class="modal-header">
                <h2>${escapeHtml(c.app_id)}｜${escapeHtml(displayName(c))}</h2>
                <p>${escapeHtml(secondaryName(c))}</p>
            </div>

            ${modalImageHtml(c)}

            <div class="detail-section">
                <div class="detail-section-title">${escapeHtml(groupLabel)}</div>
                <div class="detail-section-body">${escapeHtml(categoryText(c) || '—')}</div>
            </div>

            <div class="detail-section">
                <div class="detail-section-title">${escapeHtml(fieldLabel('主酒','Primary Spirit'))}</div>
                <div class="detail-section-body">${escapeHtml(primarySpiritText(c))}</div>
            </div>

            <div class="detail-section">
                <div class="detail-section-title">${escapeHtml(fieldLabel('主要製作法','Main Method'))}</div>
                <div class="detail-section-body">${escapeHtml(mainMethodText(c) || '—')}</div>
            </div>

            <div class="detail-section">
                <div class="detail-section-title">${escapeHtml(fieldLabel('輔助操作','Auxiliary Operations'))}</div>
                <div class="detail-section-body">${escapeHtml(auxiliaryText(c) || '—')}</div>
            </div>

            <div class="detail-section">
                <div class="detail-section-title">${escapeHtml(fieldLabel('材料與用量','Ingredients'))}</div>
                <div class="detail-section-body">${ingredientsHtml || 'N/A'}</div>
            </div>

            <div class="detail-section">
                <div class="detail-section-title">${escapeHtml(fieldLabel('製作方法','Method'))}</div>
                <div class="detail-section-body" style="white-space:pre-line;">${escapeHtml(methodText(c) || 'N/A')}</div>
            </div>

            <div class="detail-section">
                <div class="detail-section-title">${escapeHtml(fieldLabel('杯型','Glassware'))}</div>
                <div class="detail-section-body">${escapeHtml(glasswareText(c) || 'N/A')}</div>
            </div>

            <div class="detail-section">
                <div class="detail-section-title">${escapeHtml(fieldLabel('裝飾','Garnish'))}</div>
                <div class="detail-section-body">${escapeHtml(garnishText(c) || 'N/A')}</div>
            </div>

            ${extraTw}
            ${notesHtml}

            <div class="detail-section">
                <div class="detail-section-title">${escapeHtml(fieldLabel('資料來源','Source'))}</div>
                <div class="detail-section-body">${sourceHtml}</div>
            </div>
        `;

        modal.style.display = 'flex';
    }

    function closeModal() {
        modal.style.display = 'none';
    }

    modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
    });

    searchInput.addEventListener('input', renderList);
    baseFilter.addEventListener('change', renderList);
    if (secondaryAlcoholFilter) secondaryAlcoholFilter.addEventListener('change', renderList);
    if (otherSpiritFilter) otherSpiritFilter.addEventListener('change', renderList);
    techFilter.addEventListener('change', renderList);
    categoryFilter.addEventListener('change', renderList);
    sectionFilter.addEventListener('change', renderList);
    if (garnishPresenceFilter) garnishPresenceFilter.addEventListener('change', renderList);
    if (garnishTypeFilter) garnishTypeFilter.addEventListener('change', renderList);
    if (glasswareFilter) glasswareFilter.addEventListener('change', renderList);
    if (clearAllFilters) clearAllFilters.addEventListener('click', clearFilters);

    
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => setLanguageMode(btn.dataset.lang));
        btn.classList.toggle('active', btn.dataset.lang === languageMode);
    });

    if (sourceSelect) {
        sourceSelect.value = currentSource;
        sourceSelect.addEventListener('change', () => loadCocktails(sourceSelect.value));
    }

    loadCocktails(currentSource);
</script>
</body>
</html>
