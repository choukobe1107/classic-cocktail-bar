<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>經典調酒吧 16-bit</title>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000022;
            --panel-bg: #000000;
            --text-color: #ffffff;
            --border-color: #ffffff;
            --btn-primary: #FFB800; /* 黃金色 */
            --btn-secondary: #FF6B00; /* 橘色 */
            --shadow-color: #000000;
        }

        * {
            box-sizing: border-box;
            font-family: 'DotGothic16', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* 手機優先容器 */
        #app-container {
            width: 100%;
            max-width: 480px; /* 模擬手機寬度 */
            min-height: 100vh;
            position: relative;
            background-color: var(--bg-color);
            background-image: linear-gradient(#000044 1px, transparent 1px), linear-gradient(90deg, #000044 1px, transparent 1px);
            background-size: 20px 20px; /* 像素網格背景 */
        }

        /* RPG 風格視窗框 */
        .rpg-box {
            background-color: var(--panel-bg);
            border: 4px solid var(--border-color);
            padding: 16px;
            box-shadow: 6px 6px 0 var(--shadow-color);
            margin-bottom: 20px;
        }

        /* 按鈕風格 */
        .btn {
            background-color: var(--btn-primary);
            color: #000;
            border: 4px solid #fff;
            padding: 10px 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 4px 4px 0 var(--shadow-color);
            text-align: center;
            display: inline-block;
            transition: transform 0.1s;
        }
        .btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0 var(--shadow-color);
        }
        .btn-orange {
            background-color: var(--btn-secondary);
            color: #fff;
        }

        /* 標題區 */
        header {
            padding: 20px 15px 10px;
            text-align: center;
        }
        h1 { margin: 0; font-size: 28px; text-shadow: 4px 4px 0 #000; color: var(--btn-primary); }

        /* 搜尋與篩選區 */
        .controls { padding: 0 15px; }
        .input-group { margin-bottom: 15px; }
        .input-rpg {
            width: 100%;
            padding: 10px;
            background: #000;
            border: 3px solid #fff;
            color: #fff;
            font-size: 16px;
            box-shadow: inset 2px 2px 0 #333;
        }
        .input-rpg:focus { outline: none; border-color: var(--btn-primary); }
        
        .filter-row { display: flex; gap: 10px; }
        .filter-row select { flex: 1; }

        /* 酒譜列表 */
        .cocktail-list { padding: 15px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 80px; }
        .cocktail-card {
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cocktail-info h3 { margin: 0 0 5px 0; font-size: 18px; color: var(--btn-primary); }
        .cocktail-info p { margin: 0; font-size: 14px; color: #aaa; }
        .fav-icon { font-size: 24px; color: var(--btn-secondary); }

        /* 年齡確認蓋板 */
        #age-gate {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; padding: 20px; text-align: center;
        }
        #age-gate h2 { color: red; font-size: 32px; margin-bottom: 10px; text-shadow: 3px 3px 0 #500;}

        /* 詳細資訊 Modal */
        #modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none;
            justify-content: center; align-items: center; z-index: 500;
        }
        .modal-content {
            width: 90%; max-width: 420px; max-height: 90vh; overflow-y: auto;
        }
        .modal-content h2 { color: var(--btn-primary); border-bottom: 2px dashed #fff; padding-bottom: 10px; }
        .detail-row { margin-bottom: 10px; line-height: 1.5; }
        .detail-label { color: var(--btn-secondary); font-weight: bold; }
        .tag { display: inline-block; background: #333; border: 1px solid #fff; padding: 2px 6px; font-size: 12px; margin: 2px 2px 2px 0; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="age-gate" class="rpg-box">
        <h2>警告 WARNING</h2>
        <p>前方區域為成人專屬<br>您是否已年滿 18 歲？</p>
        <p style="font-size:12px; color:#aaa;">(飲酒過量，有害健康)</p>
        <br>
        <button class="btn" onclick="enterTavern()">[ 是的，我已滿18歲 ]</button>
        <br><br>
        <button class="btn btn-orange" onclick="leaveTavern()">[ 否，我先離開 ]</button>
    </div>

    <div id="main-app" class="hidden">
        <header>
            <h1>🍸 經典調酒吧</h1>
        </header>

        <div class="controls rpg-box" style="margin: 15px;">
            <div class="input-group">
                <input type="text" id="searchInput" class="input-rpg" placeholder="搜尋酒名或材料 (如: 琴酒)">
            </div>
            <div class="filter-row">
                <select id="baseFilter" class="input-rpg">
                    <option value="">-- 六大基酒 --</option>
                    <option value="琴酒">琴酒 Gin</option>
                    <option value="伏特加">伏特加 Vodka</option>
                    <option value="蘭姆酒">蘭姆酒 Rum</option>
                    <option value="龍舌蘭">龍舌蘭 Tequila</option>
                    <option value="威士忌">威士忌 Whiskey</option>
                    <option value="白蘭地">白蘭地 Brandy</option>
                </select>
                <select id="techFilter" class="input-rpg">
                    <option value="">-- 調製手法 --</option>
                    <option value="搖盪">搖盪 Shake</option>
                    <option value="攪拌">攪拌 Stir</option>
                    <option value="直調">直調 Build</option>
                    <option value="混合">混合 Blend</option>
                </select>
            </div>
            <div class="input-group" style="margin-top:15px; display:flex; justify-content:space-between; align-items:center;">
                <label style="cursor:pointer;"><input type="checkbox" id="favFilter"> 只顯示收藏 ♥</label>
                <span id="resultCount" style="color:#aaa;">30 款</span>
            </div>
        </div>

        <div id="cocktail-list" class="cocktail-list">
            </div>
    </div>

    <div id="modal">
        <div class="rpg-box modal-content" id="modal-content-box">
            </div>
    </div>
</div>

        { id: 30, zh: "白蘭地庫斯塔", en: "Brandy Crusta", base: "白蘭地", ingredients: ["干邑白蘭地", "橙酒", "黑櫻桃酒", "檸檬汁", "糖漿", "安格斯苦精"], proportion: "白蘭地 52ml, 橙酒 7ml, 檸檬汁 15ml...", technique: "搖盪", glass: "鬱金香杯", garnish: "半顆檸檬皮圈與糖口", desc: "Sidecar 的華麗前身，杯口的整圈檸檬皮是最大特色。" }
    ];

    // 初始化收藏清單 (讀取 localStorage)
    let favorites = JSON.parse(localStorage.getItem('pixelBarFavs')) || [];

    // DOM 元素
    const app = document.getElementById('main-app');
    const ageGate = document.getElementById('age-gate');
    const listContainer = document.getElementById('cocktail-list');
    const searchInput = document.getElementById('searchInput');
    const baseFilter = document.getElementById('baseFilter');
    const techFilter = document.getElementById('techFilter');
    const favFilter = document.getElementById('favFilter');
    const resultCount = document.getElementById('resultCount');
    const modal = document.getElementById('modal');
    const modalContentBox = document.getElementById('modal-content-box');

    // 年齡確認邏輯
    function enterTavern() {
        ageGate.classList.add('hidden');
        app.classList.remove('hidden');
        renderList();
    }

    function leaveTavern() {
        alert("未滿18歲請勿飲酒，期待您成年後再來拜訪！");
        window.location.href = "https://www.google.com";
    }

    // 渲染酒譜列表
    function renderList() {
        const searchTerm = searchInput.value.toLowerCase();
        const base = baseFilter.value;
        const tech = techFilter.value;
        const showFavs = favFilter.checked;

        // 篩選資料
        const filtered = cocktails.filter(c => {
            const matchSearch = c.zh.includes(searchTerm) || c.en.toLowerCase().includes(searchTerm) || c.ingredients.join('').includes(searchTerm);
            const matchBase = base === "" || c.base === base;
            const matchTech = tech === "" || c.technique.includes(tech);
            const matchFav = !showFavs || favorites.includes(c.id);
            return matchSearch && matchBase && matchTech && matchFav;
        });

        resultCount.innerText = `${filtered.length} 款`;
        listContainer.innerHTML = '';

        if(filtered.length === 0) {
            listContainer.innerHTML = '<div class="rpg-box" style="text-align:center;">找不到符合的酒譜...</div>';
            return;
        }

        filtered.forEach(c => {
            const isFav = favorites.includes(c.id);
            const card = document.createElement('div');
            card.className = 'rpg-box cocktail-card';
            card.onclick = () => openModal(c);
            
            card.innerHTML = `
                <div class="cocktail-info">
                    <h3>${c.zh}</h3>
                    <p>${c.en}</p>
                    <div style="margin-top:5px;">
                        <span class="tag">${c.base}</span>
                        <span class="tag">${c.technique}</span>
                    </div>
                </div>
                <div class="fav-icon" onclick="toggleFav(event, ${c.id})">
                    ${isFav ? '♥' : '♡'}
                </div>
            `;
            listContainer.appendChild(card);
        });
    }

    // 收藏功能切換
    function toggleFav(e, id) {
        e.stopPropagation(); // 阻止點擊事件傳遞到卡片開啟 Modal
        if(favorites.includes(id)) {
            favorites = favorites.filter(favId => favId !== id);
        } else {
            favorites.push(id);
        }
        localStorage.setItem('pixelBarFavs', JSON.stringify(favorites));
        renderList(); // 重新渲染更新愛心圖示
    }

    // 開啟詳細資訊
    function openModal(c) {
        const isFav = favorites.includes(c.id);
        modalContentBox.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2 style="margin:0;">${c.zh} <span style="font-size:14px; color:#aaa;">${c.en}</span></h2>
            </div>
            
            <div style="margin-top:15px;">
                <div class="detail-row"><span class="detail-label">▶ 基酒：</span>${c.base}</div>
                <div class="detail-row"><span class="detail-label">▶ 手法：</span>${c.technique}</div>
                <div class="detail-row"><span class="detail-label">▶ 杯型：</span>${c.glass}</div>
                <div class="detail-row"><span class="detail-label">▶ 裝飾：</span>${c.garnish}</div>
                <div class="detail-row"><span class="detail-label">▶ 材料：</span><br>${c.ingredients.map(i=>` - ${i}`).join('<br>')}</div>
                <div class="detail-row"><span class="detail-label">▶ 比例：</span><br>${c.proportion}</div>
                <div class="detail-row"><span class="detail-label">▶ 筆記：</span><br>${c.desc}</div>
            </div>
            <div style="text-align:center; margin-top:20px;">
                <button class="btn btn-orange" onclick="closeModal()">[ 關閉視窗 ]</button>
            </div>
        `;
        modal.style.display = 'flex';
    }

    // 關閉詳細資訊
    function closeModal() {
        modal.style.display = 'none';
    }

    // 點擊 Modal 背景關閉
    modal.addEventListener('click', (e) => {
        if(e.target === modal) closeModal();
    });

    // 綁定事件監聽
    searchInput.addEventListener('input', renderList);
    baseFilter.addEventListener('change', renderList);
    techFilter.addEventListener('change', renderList);
    favFilter.addEventListener('change', renderList);

</script>
</body>
</html>
